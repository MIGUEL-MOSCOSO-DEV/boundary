[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-audit"
version = "1.0.0"
description = "Policy-driven API authorization testing with redacted evidence"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miguel Moscoso", email = "miguelmoscoso.devperu@gmail.com"}]
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
boundary = "boundary.cli:main"

[tool.setuptools.packages.find]
include = ["boundary*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
